<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">Frame p95 and measured GPU p95 by encounter and cap</title>
<desc id="desc">Horizontal paired bars show run-level p95 medians from three 20-second runs. Frame times range from 8.77 to 16.78 milliseconds; GPU render times range from 1.00 to 1.11 milliseconds.</desc>
<rect width="1040" height="480" fill="#ffffff"/>
<text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#172b3a">Frame p95 and measured GPU p95</text>
<text x="28" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#526777">Median run-level percentile, milliseconds · 3 repeats per condition</text>
<rect x="690" y="28" width="13" height="13" rx="2" fill="#2471a3"/><text x="712" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#344a59">Frame p95</text>
<rect x="810" y="28" width="13" height="13" rx="2" fill="#c97713"/><text x="832" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#344a59">GPU p95</text>
<line x1="330" y1="92" x2="330" y2="399" stroke="#dfe6eb" stroke-width="1"/>
